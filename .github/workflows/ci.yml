name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ./gradlew, not the runner's preinstalled gradle, so CI uses the same
      # pinned Gradle version as `make check` on a laptop.
      - name: Run tests
        run: ./gradlew test --console=plain

      - name: Run CodeNarc (vars/)
        run: ./gradlew codenarcMain --console=plain

      - name: Run CodeNarc (test/)
        run: ./gradlew codenarcTest --console=plain

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test

      - name: Upload CodeNarc reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codenarc-report
          path: build/reports/codenarc
