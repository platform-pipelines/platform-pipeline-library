name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run tests
        run: gradle test --console=plain

      - name: Run CodeNarc (vars/)
        run: gradle codenarcMain --console=plain

      - name: Run CodeNarc (test/)
        run: gradle codenarcTest --console=plain

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test

      - name: Upload CodeNarc reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codenarc-report
          path: build/reports/codenarc
