# .ci/config.yaml — drop this in the root of a consuming repo.
# The Jenkinsfile beside it is two lines. This file is the whole contract.

appName: payments-api
buildTool: maven          # maven | gradle | npm | python | go | docker-only
runtimeVersion: "21"

imageRepo: ghcr.io/acme/payments-api
containerize: true
dockerfile: Dockerfile

gitopsRepo: acme/gitops-manifests
gitopsBranch: main

lint:
  enabled: true
  failOnError: true       # false = report only, build stays green
  autoFormat: false       # true = apply formatters before checking

environments:
  - name: dev
    namespace: payments-dev
    manifestPath: apps/payments-api/dev/kustomization.yaml
    branchPattern: "*"                # every branch lands in dev

  - name: staging
    namespace: payments-stg
    manifestPath: apps/payments-api/staging/kustomization.yaml
    branchPattern: main

  - name: prod
    namespace: payments-prod
    manifestPath: apps/payments-api/prod/kustomization.yaml
    branchPattern: main
    requiresApproval: true
    approvers: [platform-leads, jane.doe]
    approvalTimeoutMinutes: 240

quality:
  sonar: true
  sonarProjectKey: acme_payments-api
  failOnQualityGate: true
  trivy: true
  trivyFailOn: [HIGH, CRITICAL]
  trivyIgnoreUnfixed: true
  secretScan: true
  dependencyCheck: false
  minCoverage: 70
  sbom: true              # CycloneDX SBOM, generated by trivy
  signImage: false        # cosign keyless — only useful with an admission policy

notify:
  slackChannel: "#payments-ci"
  on: change              # always | failure | change
  githubChecks: true

extra:
  nexusRepo: maven-releases
  sonarExclusions: "**/generated/**,**/target/**"
  allowSelfApproval: false

# --- supply chain ---
# imageBuilder: kaniko-docker   # kaniko-docker | kaniko-k8s | buildah
#   kaniko-docker  works with the default plugin set, needs a docker socket
#   kaniko-k8s     no socket anywhere, needs the kubernetes plugin + pod template
#   buildah        toolbox agents with subuid/fuse-overlayfs configured
