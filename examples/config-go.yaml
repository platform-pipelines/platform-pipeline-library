# Minimal Go service.
appName: edge-router
buildTool: go
runtimeVersion: "1.22"
imageRepo: ghcr.io/acme/edge-router
gitopsRepo: acme/gitops-manifests

environments:
  - name: dev
    manifestPath: apps/edge-router/dev/kustomization.yaml
    branchPattern: "*"

quality:
  minCoverage: 60

notify:
  slackChannel: "#platform-ci"
