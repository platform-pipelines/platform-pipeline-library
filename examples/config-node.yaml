# Node front end. Lint reports only, so a formatting nit does not block a
# release while the team is still adopting Prettier.
appName: storefront
buildTool: npm
runtimeVersion: "20"
imageRepo: ghcr.io/acme/storefront
gitopsRepo: acme/gitops-manifests

lint:
  enabled: true
  failOnError: false

environments:
  - name: dev
    manifestPath: apps/storefront/dev/kustomization.yaml
    branchPattern: "*"
