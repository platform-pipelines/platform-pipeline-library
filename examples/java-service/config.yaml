# .ci/config.yaml — drop this in the root of a consuming repo.
#
# This is the Gradle-flavored Java example (the root examples/config.yaml is
# Maven). Same language, different build tool, to show that Java isn't tied
# to one build tool and that gradleLint/gradleBuild/gradleTest/gradlePackage
# are exercised the same way mavenLint/mavenBuild/mavenTest/mavenPackage are.

appName: catalog-service
buildTool: gradle         # maven | gradle | npm | python | go | docker-only
runtimeVersion: "21"

imageRepo: ghcr.io/acme/catalog-service
containerize: true
dockerfile: Dockerfile
# kaniko-k8s: this agent pool has no docker socket at all (locked-down
# Kubernetes nodes), so kaniko-docker is off the table and buildah would need
# subuid/fuse-overlayfs host setup we don't want to maintain here.
imageBuilder: kaniko-k8s

gitopsRepo: acme/gitops-manifests
gitopsBranch: main

lint:
  enabled: true
  failOnError: true       # Checkstyle/SpotBugs violations block the build
  autoFormat: false       # true = run spotlessApply before checking

environments:
  - name: dev
    namespace: catalog-dev
    manifestPath: apps/catalog-service/dev/kustomization.yaml
    branchPattern: "*"                # every branch lands in dev

  - name: staging
    namespace: catalog-stg
    manifestPath: apps/catalog-service/staging/kustomization.yaml
    branchPattern: main

  - name: prod
    namespace: catalog-prod
    manifestPath: apps/catalog-service/prod/kustomization.yaml
    branchPattern: main
    requiresApproval: true
    approvers: [platform-leads, jane.doe]
    approvalTimeoutMinutes: 240

quality:
  sonar: true
  sonarProjectKey: acme_catalog-service
  failOnQualityGate: true
  trivy: true
  trivyFailOn: [HIGH, CRITICAL]
  trivyIgnoreUnfixed: true
  secretScan: true
  dependencyCheck: true   # OWASP dependency-check on top of Trivy's scan
  minCoverage: 75         # JaCoCo line coverage floor
  sbom: true              # CycloneDX SBOM, generated by trivy
  signImage: true         # cosign keyless; admission policy enforces it in prod

notify:
  slackChannel: "#catalog-ci"
  on: change              # always | failure | change
  githubChecks: true

extra:
  nexusRepo: maven-releases   # Gradle still publishes JVM artifacts to Nexus
  sonarExclusions: "**/generated/**,**/build/**"
  allowSelfApproval: false
