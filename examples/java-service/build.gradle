// The four tasks the pipeline calls, and nothing it does not:
//   gradleLint    -> checkstyleMain spotbugsMain
//   gradleBuild   -> classes
//   gradleTest    -> test jacocoTestReport   (JUnit XML + JaCoCo XML for the coverage gate)
//   gradlePackage -> assemble -Pversion=<APP_VERSION>

plugins {
    id 'java'
    id 'checkstyle'
    id 'jacoco'
    id 'com.github.spotbugs' version '6.5.11'
}

group = 'com.acme'
version = findProperty('version') == 'unspecified' ? '0.1.0-SNAPSHOT' : version

repositories {
    mavenCentral()
}

java {
    // release, not a toolchain: compiles for 21 on any JDK >= 21 without
    // downloading one (gradle:9-jdk21 in CI, whatever is installed locally).
    tasks.withType(JavaCompile).configureEach { options.release = 21 }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

checkstyle {
    ignoreFailures = false
    maxWarnings = 0
}

spotbugs {
    ignoreFailures = false
}

// SpotBugs on test code is noise; the pipeline only calls spotbugsMain anyway.
tasks.named('spotbugsTest') { enabled = false }

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        xml { required = true }
        html { required = true }
    }
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true   // build/reports/jacoco/test/jacocoTestReport.xml — read by checkCoverage
        html.required = true
    }
}

jar {
    manifest {
        attributes 'Main-Class': 'com.acme.catalog.CatalogServer',
                   'Implementation-Version': project.version
    }
}
