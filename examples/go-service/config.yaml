# .ci/config.yaml — full end-to-end example for a Go service.
#
# Unlike examples/config-go.yaml (deliberately minimal), this one turns on
# every capability the library offers for an application repo: full quality
# gate, supply-chain signing, and a three-environment gitops promotion path
# with an approval gate in front of prod. Copy what you need — most repos
# will use a subset of this.

appName: edge-router
buildTool: go              # maven | gradle | npm | python | go | docker-only
runtimeVersion: "1.27"

# --- container image ---
imageRepo: ghcr.io/acme/edge-router
containerize: true          # default, spelled out here for clarity
dockerfile: Dockerfile
# kaniko-docker: works with the default plugin set and needs a docker socket
# on the agent. Pick kaniko-k8s instead if agents run as unprivileged pods
# with no socket, or buildah if agents are the toolbox image.
imageBuilder: kaniko-docker

# --- gitops promotion target ---
gitopsRepo: acme/gitops-manifests
gitopsBranch: main

lint:
  enabled: true
  failOnError: true       # a lint failure blocks the build, not just a report
  autoFormat: false        # CI should catch drift, not silently fix it

environments:
  - name: dev
    namespace: edge-router-dev
    manifestPath: apps/edge-router/dev/kustomization.yaml
    branchPattern: "*"                 # every branch lands in dev

  - name: staging
    namespace: edge-router-staging
    manifestPath: apps/edge-router/staging/kustomization.yaml
    branchPattern: main

  - name: prod
    namespace: edge-router-prod
    manifestPath: apps/edge-router/prod/kustomization.yaml
    branchPattern: main
    requiresApproval: true
    approvers: [platform-leads, jane.doe]
    approvalTimeoutMinutes: 240

quality:
  sonar: true
  sonarProjectKey: acme_edge-router
  failOnQualityGate: true
  trivy: true
  trivyFailOn: [HIGH, CRITICAL]
  trivyIgnoreUnfixed: true    # don't fail the build over a CVE with no fix yet
  secretScan: true
  dependencyCheck: true       # go.sum is small enough that this stays fast
  minCoverage: 75              # realistic for a Go service with race-detector tests
  sbom: true                   # CycloneDX SBOM, generated by trivy
  signImage: true              # cosign keyless — requires containerize: true
  #   only meaningful with an admission policy (Kyverno, Sigstore
  #   policy-controller) rejecting unsigned images in the cluster

notify:
  slackChannel: "#edge-router-ci"
  on: change              # always | failure | change
  githubChecks: true

extra:
  # Free-form bag the pipeline itself never reads — consuming teams use it
  # for their own tooling (e.g. a wrapper script that greps .ci/config.yaml).
  owningTeam: platform-networking
