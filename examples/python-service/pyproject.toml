[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "orders-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["flask>=3.1,<4", "gunicorn>=23,<24"]

[tool.setuptools]
packages = ["orders_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
exclude = ["^\\.venv/", "^build/", "^dist/"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["orders_api"]
