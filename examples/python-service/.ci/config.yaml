# .ci/config.yaml — a containerized Python web service, exercising the full
# feature set. A background worker with no image would set
# `containerize: false` and drop imageRepo, gitopsRepo and environments.

appName: orders-api
buildTool: python
runtimeVersion: "3.12"

imageRepo: ghcr.io/acme/orders-api
containerize: true
dockerfile: Dockerfile

# buildah, not the kaniko-docker default: these agents are toolbox images
# with subuid/fuse-overlayfs already configured, and the team wants no
# docker socket on the box at all.
imageBuilder: buildah

gitopsRepo: acme/gitops-manifests
gitopsBranch: main

lint:
  enabled: true
  failOnError: true       # ruff + mypy problems block the build
  autoFormat: false        # CI checks formatting, it does not fix it for you

environments:
  - name: dev
    namespace: orders-dev
    manifestPath: apps/orders-api/dev/kustomization.yaml
    branchPattern: "*"                 # every branch lands in dev

  - name: staging
    namespace: orders-stg
    manifestPath: apps/orders-api/staging/kustomization.yaml
    branchPattern: main

  - name: prod
    namespace: orders-prod
    manifestPath: apps/orders-api/prod/kustomization.yaml
    branchPattern: main
    requiresApproval: true
    approvers: [platform-leads, orders-team]
    approvalTimeoutMinutes: 240

quality:
  sonar: true
  sonarProjectKey: acme_orders-api
  sonarExclusions: "**/migrations/**,**/tests/**"
  failOnQualityGate: true
  trivy: true
  trivyFailOn: [HIGH, CRITICAL]
  trivyIgnoreUnfixed: true    # a fix that does not exist yet cannot block a release
  secretScan: true
  dependencyCheck: true       # pip dependencies get their own CVE pass, not just the image
  dependencyCheckCvss: 7      # fail on CVSS >= 7 (the default)
  minCoverage: 75              # pytest --cov gate; below this the build goes red
  sbom: true                   # CycloneDX SBOM, generated by Trivy
  signImage: true               # cosign keyless — paired with the cluster's admission policy

publish:
  nexusRepo: pypi-internal

approval:
  allowSelfApproval: false

notify:
  slackChannel: "#orders-ci"
  on: change              # always | failure | change
  githubChecks: true
