# .ci/config.yaml — full production Node.js API example.
#
# What a mature service repo's config looks like once every quality gate is
# actually enforced: build breaks on lint, on coverage, on a critical CVE, on
# a leaked secret — and every image that reaches prod is signed. A repo still
# adopting Prettier would start with `lint.failOnError: false` (report-only).

appName: checkout-api
buildTool: npm
runtimeVersion: "24"      # node:24-alpine; package.json engines and the Dockerfile match

imageRepo: ghcr.io/acme/checkout-api
containerize: true
dockerfile: Dockerfile
# kaniko-docker: this repo's agents already have a docker socket from the
# default plugin set, so there's no reason to pay for a pod-template-per-build
# (kaniko-k8s) or a toolbox agent with subuid/fuse-overlayfs (buildah).
imageBuilder: kaniko-docker

gitopsRepo: acme/gitops-manifests
gitopsBranch: main

lint:
  enabled: true
  failOnError: true     # ESLint/Prettier are fully adopted here — a nit blocks the build
  autoFormat: true       # `npx prettier --write` + `eslint --fix` run before checking,
                          # so a contributor's build fails only on what autofix can't solve

environments:
  - name: dev
    namespace: checkout-dev
    manifestPath: apps/checkout-api/dev/kustomization.yaml
    branchPattern: "*"                 # every branch lands in dev

  - name: staging
    namespace: checkout-stg
    manifestPath: apps/checkout-api/staging/kustomization.yaml
    branchPattern: main

  - name: prod
    namespace: checkout-prod
    manifestPath: apps/checkout-api/prod/kustomization.yaml
    branchPattern: main
    requiresApproval: true
    approvers: [platform-leads, checkout-oncall]
    approvalTimeoutMinutes: 240

quality:
  sonar: true
  sonarProjectKey: acme_checkout-api
  failOnQualityGate: true
  trivy: true
  trivyFailOn: [HIGH, CRITICAL]
  trivyIgnoreUnfixed: true    # a HIGH CVE with no available fix yet can't be actioned
  secretScan: true
  dependencyCheck: true        # npm's own dependency graph is worth a second scanner
  minCoverage: 75               # realistic for a service with integration-test-heavy coverage
  sbom: true                    # CycloneDX SBOM, generated by Trivy
  signImage: true                # cosign keyless — paired with the cluster's admission policy,
                                  # which rejects any image without a valid signature

notify:
  slackChannel: "#checkout-ci"
  on: change              # always | failure | change
  githubChecks: true

publish:
  githubRelease: true     # npm pack tarball attached to the v<version> GitHub release

approval:
  allowSelfApproval: false
