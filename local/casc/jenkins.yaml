# Whole controller config as code. Rebuilding Jenkins from scratch is a
# docker compose up, not a two-day recovery.

jenkins:
  systemMessage: "Managed by JCasC. Do not configure through the UI."
  numExecutors: 0            # controller never runs builds
  mode: EXCLUSIVE
  scmCheckoutRetryCount: 3

  authorizationStrategy:
    roleBased:
      roles:
        global:
          - name: admin
            permissions: [Overall/Administer]
            entries:
              - group: platform-leads
          - name: developer
            permissions:
              - Overall/Read
              - Job/Build
              - Job/Read
              - Job/Cancel
            entries:
              - group: developers

  securityRealm:
    local:
      allowsSignup: false

  # Build steps run inside this image on every agent that is not itself the
  # toolbox (see vars/appToolImage.groovy). Stock language images lack the
  # linters and scanners the steps call; build it with `make toolbox-build`.
  globalNodeProperties:
    - envVars:
        env:
          - key: CI_TOOLBOX_IMAGE
            value: "${CI_TOOLBOX_IMAGE:-ci-toolbox:local}"

  nodes:
    - permanent:
        name: linux-agent-1
        labelString: "linux docker"
        numExecutors: 4
        remoteFS: /home/jenkins/agent
        launcher:
          inbound:
            workDirSettings:
              disabled: false

  # Only needed for imageBuilder: kaniko-k8s (see vars/buildImageKanikoK8s.groovy),
  # which runs kaniko as a sidecar container named 'kaniko' in the agent pod.
  # Requires the kubernetes plugin (commented out in local/plugins.txt).
  #
  # clouds:
  #   - kubernetes:
  #       name: k8s
  #       serverUrl: https://kubernetes.default
  #       namespace: jenkins
  #       templates:
  #         - name: kaniko
  #           label: "linux kaniko"
  #           containers:
  #             - name: jnlp
  #               image: jenkins/inbound-agent:latest
  #             - name: kaniko
  #               image: gcr.io/kaniko-project/executor:v1.23.2-debug
  #               command: /busybox/cat
  #               ttyEnabled: true

security:
  scriptApproval:
    approvedSignatures:
      - "method java.lang.String lastIndexOf java.lang.String"

unclassified:
  location:
    url: http://localhost:8080/
    adminAddress: platform@acme.example

  globalLibraries:
    libraries:
      - name: platform-pipeline
        defaultVersion: main
        implicit: false
        allowVersionOverride: true
        retriever:
          modernSCM:
            scm:
              git:
                remote: https://github.com/platform-pipelines/platform-pipeline-library.git
                credentialsId: github-token

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: github-token
              secret: "${GITHUB_TOKEN}"
              description: GitHub App installation token
          - string:
              scope: GLOBAL
              id: sonar-token
              secret: "${SONAR_TOKEN}"
              description: SonarQube analysis token
          - string:
              scope: GLOBAL
              id: slack-webhook
              secret: "${SLACK_WEBHOOK}"
              description: Slack incoming webhook
          - string:
              scope: GLOBAL
              id: argocd-token
              secret: "${ARGOCD_TOKEN}"
              description: Argo CD API token
          - usernamePassword:
              scope: GLOBAL
              id: ghcr-credentials
              username: "${GHCR_USER}"
              password: "${GHCR_TOKEN}"
              description: GitHub Container Registry
          - usernamePassword:
              scope: GLOBAL
              id: nexus-credentials
              username: "${NEXUS_USER}"
              password: "${NEXUS_PASS}"
              description: Nexus repository
          - usernamePassword:
              scope: GLOBAL
              id: aws-credentials
              username: "${AWS_ACCESS_KEY_ID}"
              password: "${AWS_SECRET_ACCESS_KEY}"
              description: AWS access key (terraform / cloudformation; roles are assumed from it)
          - string:
              scope: GLOBAL
              id: cosign-oidc-token
              secret: "${COSIGN_OIDC_TOKEN}"
              description: OIDC identity token for keyless cosign signing
